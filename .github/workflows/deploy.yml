name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Vorschaubilder für Prompts und Komponenten holen (fehlende werden übersprungen).
      - run: node scripts/fetch-previews.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    # Läuft nur auf main (Push oder manuell gestartet), nie für Pull Requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # SSH auf dem VPS ist nicht öffentlich: Es läuft über den Cloudflare
      # Tunnel (VPS_HOST = ssh.xovex.de), vor dem Cloudflare Access steht.
      # Der Runner kommt mit einem Service-Token durch.
      - name: cloudflared installieren
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # Schnelltest vor dem rsync: Lässt Cloudflare Access das Service-Token
      # durch? Sonst wartet cloudflared minutenlang auf einen Browser-Login.
      - name: Cloudflare Access prüfen
        env:
          HOST: ${{ secrets.VPS_HOST }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" "https://$HOST/")
          echo "Antwort von Cloudflare Access: HTTP $code"
          if [ "$code" = "302" ] || [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::Cloudflare Access lässt das Service-Token nicht durch (HTTP $code). An der Access-Application für den SSH-Host muss eine Policy mit Action 'Service Auth' und genau diesem Token hängen; Client-ID und Secret müssen zum selben Token gehören."
            exit 1
          fi

      - name: Auf den VPS kopieren
        timeout-minutes: 5
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # Host-Key aus dem Secret: ssh-keyscan kommt nicht durch den Tunnel.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Der Schlüssel darf auf dem Server nur per rrsync nach
          # /var/www/xurax.de schreiben; "/" ist dort genau dieser Ordner.
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ProxyCommand='cloudflared access ssh --hostname %h --id $CF_ID --secret $CF_SECRET'" \
            dist/ "$USER@$HOST:/"

      - name: Seite prüfen
        run: curl -fsS -o /dev/null -w 'https://xurax.de -> %{http_code}\n' https://xurax.de/
