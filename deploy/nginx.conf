# Alternative zu Caddy: nginx (HTTPS z. B. per certbot --nginx).
server {
    listen 80;
    server_name xurax.de www.xurax.de;
    root /var/www/xurax.de;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
